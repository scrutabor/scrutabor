<!doctype html>
<!-- No static data-theme: the pre-paint script below stamps one before
     first paint whenever scripts run, and with them off the attribute's
     absence is what lets the prefers-color-scheme fallback in app.css
     answer — a hard-coded "light" here overrode a dark-preferring reader
     exactly where nothing else could. -->
<html lang="%app.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Installed, the browser paints this behind the status bar, so it
		     tracks the chosen theme rather than the system one. -->
		<meta name="theme-color" content="#f7f1e6" />
		<script>
			// Resolve the theme before first paint: stored choice, else system.
			try {
				var t = localStorage.getItem('scrutabor-theme');
				if (t === 'church') t = 'dark'; // migrate the retired third theme
				if (t !== 'light' && t !== 'dark') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = t;
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', t === 'dark' ? '#1a1611' : '#f7f1e6');
				// …and the text size, for the same reason: a reader who asked
				// for large print should not watch the page start small. The
				// knob is the root size, so the whole book follows; the steps
				// are mirrored in lib/reading.svelte.ts.
				var r = localStorage.getItem('scrutabor-reading');
				var steps = { normal: '100%', larger: '120%', largest: '140%' };
				if (!steps[r]) r = 'normal';
				document.documentElement.dataset.reading = r;
				document.documentElement.style.fontSize = steps[r];
				// …and the reading MODE. The prerendered markup is the
				// interlinear (the default); a reader whose stored mode is
				// another would watch it flash and swap at mount, now that
				// the bare modes read at their own scale. The stamp lets a
				// CSS rule hold the text back until hydration re-renders it
				// in their mode (app.css), and the components read the same
				// stored value at init, so hydration is the ONE re-render.
				// …and WHICH PLATFORM draws the native menus. Only one thing
				// reads it: Chrome on Windows draws a select's list itself,
				// square and tight, and takes no padding or radius from the
				// page. macOS and Android hand that list to the system, where
				// it already looks like the system it is on, so they are left
				// alone (DayPicker.svelte). Stamped here rather than measured
				// later because the list must be right on its first opening.
				var plat =
					(navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
				if (/win/i.test(plat)) document.documentElement.dataset.platform = 'windows';
				var h = localStorage.getItem('scrutabor-help');
				document.documentElement.dataset.help = h === '0' || h === '2' ? h : '1';
				// A failed application chunk must not turn the static prayer into
				// a blank page forever. Normal hydration clears the hold in a few
				// frames; after two seconds the prerendered interlinear is the
				// safer fallback, even if it briefly differs from the stored mode.
				setTimeout(function () {
					if (document.documentElement.dataset.hydrated !== 'true')
						document.documentElement.dataset.modeHold = 'released';
				}, 2000);
			} catch (e) {
				/* keep the static default */
			}
		</script>
		<script>
			// Counting visits, and refusing to do anything more.
			//
			// Cloudflare Web Analytics: no cookie, no local storage, no
			// identifier of any kind, so there is nothing to consent to and no
			// banner to show. What it can answer is how many pages were opened
			// and which ones — which is the whole question, since our URLs
			// already name the language and the prayer.
			//
			// Five gates, and the beacon loads only if it passes all of them.
			// The token is stamped in at build time and is empty everywhere but
			// the production build, so a dev server, a preview deployment and a
			// downloaded copy of the book are silent by construction.
			(function () {
				var token = '%app.beacon%';
				// A token is a plain id. Anything else was not one, and is not
				// going into the page.
				if (!/^[0-9a-z]{16,64}$/i.test(token)) return;
				// The site itself, never a wrapper, a preview or a disk.
				if (location.hostname !== 'scrutabor.org') return;
				// A reader who has asked not to be counted is not counted.
				if (navigator.doNotTrack === '1' || navigator.globalPrivacyControl) return;
				// Airplane mode: do not ask for a script that cannot arrive.
				if (navigator.onLine === false) return;
				var s = document.createElement('script');
				s.defer = true;
				s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
				s.setAttribute('data-cf-beacon', '{"token":"' + token + '"}');
				document.head.appendChild(s);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
