<!doctype html>
<html lang="%app.lang%" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Resolve the theme before first paint: stored choice, else system.
			try {
				var t = localStorage.getItem('scrutabor-theme');
				if (t === 'church') t = 'dark'; // migrate the retired third theme
				if (t !== 'light' && t !== 'dark') {
					t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = t;
			} catch (e) {
				/* keep the static default */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
