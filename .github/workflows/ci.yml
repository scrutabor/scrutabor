name: ci

on:
  push:
    # *-gate: the conventions' pattern for risky work — push a gate
    # branch, let CI prove it, fast-forward main. Without this line the
    # pattern silently proved nothing: no workflow ever ran on a gate
    # branch, and the wait for its verdict could only time out.
    branches: [main, '*-gate']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # A copy of something is how the reading surfaces drift apart: one
      # copy gets fixed and the others quietly do not. The threshold is
      # zero, so a new one has to be named rather than merged.
      - run: npm run lint:clones
      - run: npm run check
      - run: npm run build
      # The browser download dominates CI time; cache it keyed to the
      # lockfile so only a Playwright version bump re-downloads.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
      # The deployment gate reads this ref over git smart-HTTP (no API
      # rate limits): its existence IS the green verdict for the sha.
      - if: github.ref == 'refs/heads/main'
        run: git push origin "HEAD:refs/ci-green/${GITHUB_SHA}"
