name: ci

on:
  push:
    # *-gate: the conventions' pattern for risky work — push a gate
    # branch, let CI prove it, fast-forward main.
    branches: [main, '*-gate']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/font-requirements.txt
      - name: install PDF text extraction
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v
      - run: npm ci
      # Unit tests include byte-budget and chunk-boundary assertions over the
      # published artifact. Consume the one canonical build rather than
      # rebuilding it in this job or depending on a warm working directory.
      - uses: actions/download-artifact@v8
        with:
          name: e2e-build
      - run: tar -xzf e2e-build.tgz
      - run: npm run lint
      # A copy of something is how the reading surfaces drift apart: one
      # copy gets fixed and the others quietly do not. The threshold is
      # zero, so a new one has to be named rather than merged.
      - run: npm run lint:clones
      - run: npm run check
      - run: npm run test:font-subsets
      - run: npm run test:unit

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Hosted and folder editions come from one checkout and are built once.
      # A tarball avoids making the artifact service enumerate thousands of
      # prerendered pages and compresses their repeated markup efficiently.
      - run: npm run build:offline
      # SvelteKit's preview server reads its generated server manifest even
      # for an adapter-static build; carry that small control plane beside
      # the two public artifacts so a clean shard can serve `build/`.
      - run: tar -czf e2e-build.tgz .svelte-kit/output build build-offline
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-build
          path: e2e-build.tgz
          compression-level: 0
          retention-days: 1

  e2e:
    name: e2e (${{ matrix.name }})
    needs: build-artifacts
    runs-on: ubuntu-latest
    # Keep browser binaries and their OS libraries together. The package pin
    # below must match this image; changing it requires the full browser gate.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: hosted-1, project: hosted, shard: '1/2', no_server: '0' }
          - { name: hosted-2, project: hosted, shard: '2/2', no_server: '0' }
          - { name: offline-1, project: offline, shard: '1/2', no_server: '1' }
          - { name: offline-2, project: offline, shard: '2/2', no_server: '1' }
          # The deployed tree served with the static host's own rules: history
          # traversal, redirects and the worker's whole-book promise are proven
          # against build/ alone, which preview cannot do.
          - { name: static-host, project: static-host, shard: '1/1', no_server: '0' }
          - {
              name: reader-firefox,
              project: reader-firefox,
              browser: firefox,
              shard: '1/1',
              no_server: '0'
            }
          - {
              name: reader-webkit,
              project: reader-webkit,
              browser: webkit,
              shard: '1/1',
              no_server: '0'
            }
          - { name: sweep-1, project: hosted-sweep, shard: '1/4', no_server: '0' }
          - { name: sweep-2, project: hosted-sweep, shard: '2/4', no_server: '0' }
          - { name: sweep-3, project: hosted-sweep, shard: '3/4', no_server: '0' }
          - { name: sweep-4, project: hosted-sweep, shard: '4/4', no_server: '0' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: align browser home ownership
        # GitHub mounts a host-owned home into the root-run test container.
        # Firefox requires that directory to belong to its current user.
        run: |
          test "$(id -u)" -eq 0
          test "$HOME" = /github/home
          test -d /github/home
          test ! -L /github/home
          chown --no-dereference 0:0 -- /github/home
          test -d /github/home
          test ! -L /github/home
          test "$(stat -c '%u' /github/home)" -eq "$(id -u)"
      - name: verify browser image version and record inputs
        run: |
          node -e "const actual = require('@playwright/test/package.json').version; if (actual !== '1.63.0') throw new Error('Playwright image/package mismatch: ' + actual)"
          node --version
          npm --version
          npx playwright --version
          sha256sum package-lock.json
          printf 'revision=%s project=%s shard=%s\n' "$GITHUB_SHA" '${{ matrix.project }}' '${{ matrix.shard }}'
          printf 'uid=%s home=%s browser_path=%s\n' "$(id -u)" "$HOME" "$PLAYWRIGHT_BROWSERS_PATH"
          fc-list | LC_ALL=C sort | sha256sum
          fc-match serif
      - uses: actions/download-artifact@v8
        with:
          name: e2e-build
      - run: tar -xzf e2e-build.tgz
      - name: install PDF text extraction
        if: ${{ !matrix.browser }}
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends poppler-utils
          pdftotext -v
      - run: npx playwright test --project=${{ matrix.project }} --no-deps --shard=${{ matrix.shard }}
        env:
          SCRUTABOR_E2E_PREBUILT: '1'
          SCRUTABOR_E2E_NO_SERVER: ${{ matrix.no_server }}
      - name: publish browser timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.name }}
          path: playwright-report/timings.json
          if-no-files-found: warn
          retention-days: 3
      # A failed shard keeps its own evidence (error contexts, traces and any
      # report) under its matrix name, so the page state is not lost with it.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.name }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  green:
    needs: [quality, build-artifacts, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || endsWith(github.ref, '-gate'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The deployment gate reads this exact-SHA ref over git smart-HTTP.
      - run: git push origin "HEAD:refs/ci-green/${GITHUB_SHA}"
